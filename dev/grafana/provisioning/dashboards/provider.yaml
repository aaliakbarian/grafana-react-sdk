apiVersion: 1

providers:
  - name: Grafana React SDK POC dashboards
    orgId: 1
    folder: Grafana React SDK POC
    folderUid: grsdk-phase0-poc-folder
    type: file
    disableDeletion: true
    editable: false
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
